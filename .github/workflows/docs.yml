# Builds the mdBook site in docs-site/ and publishes it to GitHub Pages.
#
# Deploy runs on `main` only, so the published site matches the released binary. A pull
# request builds but does not deploy — that is what catches a SUMMARY.md entry pointing at
# a file that does not exist, which mdbook reports as a warning rather than a failure, so
# the build step turns those into an error explicitly.
#
# `workflow_dispatch` allows publishing from another branch deliberately. Pages must be set
# to "GitHub Actions" in the repository settings before the first deploy.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: '0.5.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # BEFORE the build: mdbook CREATES a chapter file that SUMMARY.md lists but the
      # tree does not have, then exits 0 and publishes a blank page. Measured on 0.5.4.
      # Once mdbook has run, the file exists and the evidence is gone.
      - name: Check SUMMARY against the tree
        run: python3 .github/scripts/check_book.py summary docs-site

      - name: Build
        run: |
          set -euo pipefail
          # A `{{#include}}` whose source is missing prints ERROR and WARN and still exits
          # 0, embedding the error text in the page. The log is the only signal.
          mdbook build docs-site 2>build.log || { cat build.log; exit 1; }
          cat build.log
          if grep -qE '^(ERROR| WARN)' build.log; then
            echo "::error::mdbook logged an error or warning; treating it as a failure" >&2
            exit 1
          fi

      - name: Check links and that no page is empty
        run: python3 .github/scripts/check_book.py built docs-site/book

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/book

  deploy:
    # Deploy only from the default branch, or when dispatched by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
