name: eidolon-tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  fmt:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Check formatting
      run: cargo fmt --all -- --check

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-latest-cargo-
    - name: Build
      run: cargo build
    # Deny rustc warnings across ALL targets, tests included. A stray duplicated
    # `#[test]` attribute silently DISABLED `denovo_bnd_emits_a_cross_linked_mate_pair`
    # — the #451 regression guard — while making another test run twice, which reads as
    # a passing "2 passed". rustc said `duplicated attribute` and `function is never
    # used` the whole time and nothing was listening. The tree is at zero rustc warnings,
    # so this costs nothing to hold.
    - name: Deny warnings (a disabled test is a silent warning)
      run: cargo build --workspace --all-targets
      env:
        RUSTFLAGS: "-D warnings"
    - name: Run tests
      run: cargo test --verbose --workspace

  # The Delta harness scripts determine numbers the ACCESS report cites and were
  # covered by nothing automatic (#466). They are bash, so cargo test cannot reach
  # them; this job runs their own suite and then proves that suite is non-vacuous by
  # mutating the production code and requiring every mutation to be caught.
  delta-harness:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install bcftools
      run: sudo apt-get update -qq && sudo apt-get install -y -qq bcftools
    - name: Shell syntax check
      run: |
        for f in scripts/delta/*.sh scripts/delta/*.sbatch scripts/delta/tests/*.sh; do
          [ -e "$f" ] || continue
          bash -n "$f" || exit 1
        done
    - name: BND geometry harness tests
      run: scripts/delta/tests/test_bnd_geometry.sh
    - name: Prove the harness tests are non-vacuous
      run: scripts/delta/tests/test_bnd_geometry.sh --mutate
    - name: INS read-verification harness tests
      run: scripts/delta/tests/test_ins_verification.sh
    - name: Prove the INS harness tests are non-vacuous
      run: scripts/delta/tests/test_ins_verification.sh --mutate
