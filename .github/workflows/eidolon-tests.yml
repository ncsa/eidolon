name: eidolon-tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  fmt:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Check formatting
      run: cargo fmt --all -- --check

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-latest-cargo-
    - name: Build
      run: cargo build
    # Deny rustc warnings across ALL targets, tests included. A stray duplicated
    # `#[test]` attribute silently DISABLED `denovo_bnd_emits_a_cross_linked_mate_pair`
    # — the #451 regression guard — while making another test run twice, which reads as
    # a passing "2 passed". rustc said `duplicated attribute` and `function is never
    # used` the whole time and nothing was listening. The tree is at zero rustc warnings,
    # so this costs nothing to hold.
    - name: Deny warnings (a disabled test is a silent warning)
      run: cargo build --workspace --all-targets
      env:
        RUSTFLAGS: "-D warnings"
    # --no-fail-fast: plain `cargo test` STOPS at the first failing test binary, so a
    # single failure hides every binary after it. Measured once at 31 of 41 binaries run,
    # reported as one failure. The run must report on everything it was asked to run.
    - name: Run tests
      run: cargo test --verbose --workspace --no-fail-fast

  # The Delta harness scripts determine numbers the ACCESS report cites and were
  # covered by nothing automatic (#466). They are bash, so cargo test cannot reach
  # them; this job runs their own suite and then proves that suite is non-vacuous by
  # mutating the production code and requiring every mutation to be caught.
  delta-harness:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    # bgzip ships in `tabix`, not in `bcftools`. test_scorer_calibration.sh drives real
    # bcftools/bgzip (only truvari is stubbed), and without bgzip it fails with an
    # indexing error that looks like a bad fixture.
    - name: Install bcftools and bgzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq bcftools tabix
    - name: Shell syntax check
      run: |
        for f in scripts/delta/*.sh scripts/delta/*.sbatch scripts/delta/tests/*.sh; do
          [ -e "$f" ] || continue
          bash -n "$f" || exit 1
        done
    # Globbed, NOT enumerated. Three suites were added one at a time and each needed two new
    # lines here; test_del_verification.sh was written and would have run nowhere, exactly the
    # hand-maintained-list drift that left truth_sv_BNDinv.vcf.gz unscored in job 20745149.
    # The scorer calibration suite in particular was written and left unwired for months —
    # it guards the selftest and decoy controls, the only things separating "the caller found
    # it" from "the matching window is loose enough to accept anything" (job 21382756).
    - name: Delta harness tests
      run: |
        n=0
        for t in scripts/delta/tests/*.sh; do
          [ -e "$t" ] || continue
          echo "──── $t"
          bash "$t" || exit 1
          n=$((n + 1))
        done
        # A glob that matches nothing exits 0 from the loop and reads as success.
        [ "$n" -gt 0 ] || { echo "no harness suites ran — the glob matched nothing" >&2; exit 1; }
        echo "$n harness suite(s) passed"
    # Every suite must also fail when the code under it is broken. A suite that cannot is
    # decoration, and this is the step that says so.
    - name: Prove the harness tests are non-vacuous
      run: |
        for t in scripts/delta/tests/*.sh; do
          [ -e "$t" ] || continue
          echo "──── $t --mutate"
          bash "$t" --mutate || exit 1
        done
