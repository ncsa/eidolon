name: Build and Release Rust Binaries

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  # Manual re-run. Without this, a release build that fails can only be retried by deleting
  # and re-pushing the tag — which is what v3.2.0 needed when its macOS target failed, and
  # is a bad thing to have to do to a published release. `ref` should be the tag.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel sibling jobs when one target fails — a Linux build
      # failure shouldn't take out the macOS / Windows / aarch64 binaries
      # that are otherwise ready to ship. Each target stands or falls on
      # its own merits, and the release just attaches whichever ones
      # succeeded.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ''
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rockylinux:8
            suffix: -rhel8
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: rockylinux:8
            suffix: -rhel8

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install build dependencies (RHEL container)
        if: matrix.container != ''
        run: |
          # `cmake` is required by the libz-ng-sys build script (transitive
          # dependency via flate2's zlib-ng feature). GitHub-hosted Linux,
          # macOS, and Windows runners all ship cmake by default, but the
          # rockylinux:8 container does not — the v1.9.0 release build
          # failed here with "is `cmake` not installed?".
          dnf install -y gcc gcc-c++ make cmake curl git openssl-devel pkgconfig perl

      - name: Checkout code
        uses: actions/checkout@v5

      # The toolchain version comes from rust-toolchain.toml, read here rather than hardcoded
      # so there is ONE source of truth.
      #
      # WHY THIS SHAPE: `dtolnay/rust-toolchain@stable` sets RUSTUP_TOOLCHAIN=stable and
      # installs `targets:` into THAT toolchain. rust-toolchain.toml then redirects cargo to
      # the pinned version, which has no cross-compilation target installed — so the build
      # dies with "can't find crate for `core`; the x86_64-apple-darwin target may not be
      # installed". Only the genuine cross-compile is affected; every other target here is
      # native to its runner, which is why v3.2.0 shipped four binaries and no macOS one.
      #
      # Installing the PINNED toolchain and its target together keeps the two agreeing.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^ *channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned toolchain: $channel"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary for upload
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/eidolon.exe release/eidolon-${{ matrix.target }}${{ matrix.suffix }}.exe
          else
            cp target/${{ matrix.target }}/release/eidolon release/eidolon-${{ matrix.target }}${{ matrix.suffix }}
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/eidolon-${{ matrix.target }}${{ matrix.suffix }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
