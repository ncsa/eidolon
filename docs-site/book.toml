[book]
title = "eidolon"
description = "Simulated sequencing reads with a golden BAM and truth VCF — user guide and reference."
authors = ["The eidolon project"]
src = "src"
language = "en"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/ncsa/eidolon"
edit-url-template = "https://github.com/ncsa/eidolon/edit/develop/docs-site/{path}"
site-url = "/eidolon/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
