# REQUIRED PARAMS
# path to input FASTQ file [required] - accepts .fastq or .fastq.gz
fastq_file:
# path to the output model file [required] - should end in '.json.gz' as it will be a gzipped file
output_file:

# OPTIONAL PARAMS
# overwrite output [optional] - set to "true" to overwrite an existing output file (default: false)
overwrite_output: false
# maximum number of reads to process [optional] - set to 0 for unlimited (default: 0)
max_reads: 0
# quality score ASCII offset [optional] - 33 for Illumina 1.8+/Sanger, 64 for older Illumina (default: 33)
qual_offset: 33
# largest read length to model, in bp [optional] - set to 0 for no limit (default: 1000)
# The model stores one transition matrix per read position (~69 KiB each), so this bounds
# memory: 1000 bp is about 67 MiB. A read longer than this is an error rather than being
# silently truncated; raise this key if your reads really are longer.
max_model_read_length: 1000
# fit a second, degraded quality population [optional] - default false
# Real Illumina data is bimodal: about one read in ten collapses toward the 3' end and stays
# collapsed, and a single transition model cannot represent that. With this on, the fit
# classifies each read and learns two populations. OPT-IN while it is unvalidated against real
# data; a model fitted without it behaves exactly as every model before it.
#
# Both populations must reach the model's read length: the fit refuses a library where, say,
# every degraded read is 60 bp and every healthy one is 100 bp, because the positions the short
# population never reached could only be filled with invented values. Trim or filter to a
# common read length if your library is ragged that way.
fit_quality_degradation: false
# window at the 3' end used to classify a read, in bases [optional] - default 50
# degradation_tail_window: 50
# a read whose last window averages below this Q is degraded [optional] - default 25
# This is a tuning knob. The fit logs the resulting fraction at this cut and at two Q either
# side, so you can see whether the populations separate or the cut is halving one distribution.
# degradation_tail_cut: 25
# binned quality bins [optional] - quantize the learned quality scores to a small bin set.
# When set, each observed Q-score is snapped to the nearest bin and gen-reads will emit only
# these values. Example presets: NovaSeq 6000 [2, 12, 23, 37], NextSeq 3-bin [2, 15, 35].
# Bins must be < 94 and cannot include 31 ('@' under Phred+33). Omit for a continuous model.
# binned_quality_bins: [2, 12, 23, 37]
# path to an aligned BAM file [optional] - used to infer the SNP transition matrix from
# read-vs-reference mismatches. The BAM must have MD tags (run 'samtools calmd' if absent).
# Ignored if transition_matrix_file is also set. If the BAM yields no mismatches, this is an
# error, not a silent fallback to the default matrix -- omit this key to use the default.
bam_file:
# path to a custom 4x4 SNP transition matrix TSV [optional] - rows and columns are A/C/G/T.
# A single header line is allowed and will be skipped. Diagonal values are ignored (set to 0).
# Takes precedence over bam_file. If neither is set, a default matrix is used.
# Example TSV format:
#   A    C    G    T
#   0.0  0.5  0.3  0.2
#   0.5  0.0  0.3  0.2
#   0.4  0.3  0.0  0.3
#   0.3  0.3  0.4  0.0
transition_matrix_file: